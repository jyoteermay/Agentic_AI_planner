apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-planner-ui
  namespace: trip-planner
  labels: { app: trip-planner-ui }
spec:
  replicas: 2
  selector:
    matchLabels: { app: trip-planner-ui }
  template:
    metadata:
      labels: { app: trip-planner-ui }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ui
          image: trip-planner:dev
          imagePullPolicy: IfNotPresent
          command: ["streamlit", "run", "streamlit_app.py",
                    "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef: { name: trip-planner-config }   # UI needs only API_URL, no secrets
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: 8501 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: trip-planner-ui
  namespace: trip-planner
spec:
  type: LoadBalancer        # Docker Desktop maps this to http://localhost
  sessionAffinity: ClientIP # keep each browser on the same pod (Streamlit keeps session state per pod)
  selector: { app: trip-planner-ui }
  ports:
    - port: 80
      targetPort: 8501